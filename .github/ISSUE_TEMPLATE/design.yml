name: Design / feature discussion
description: Propose a design change, feature, or product direction discussion.
title: "[Design]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for design discussion or feature proposals. Check the
        [roadmap](https://github.com/minori-live/heron/blob/main/agents/docs/roadmap.md) first.
        Prefer actionable scope over speculative wish lists. Proposals are also
        governed by the [engineering standards](https://github.com/minori-live/heron/blob/main/agents/docs/engineering-standards.md),
        [architecture](https://github.com/minori-live/heron/blob/main/agents/docs/architecture.md),
        [interaction design](https://github.com/minori-live/heron/blob/main/agents/docs/interaction-design.md),
        and [ADR rules](https://github.com/minori-live/heron/blob/main/agents/docs/adr/README.md).

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What user or contributor need does this address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change, and roughly where in the product or architecture?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or reasons not to do this now.
    validations:
      required: false

  - type: textarea
    id: workflow_states
    attributes:
      label: Workflow and failure states
      description: |
        Describe the normal path and the applicable unavailable, busy, failed,
        recovery, and successful end states. Use N/A with a reason for a purely
        internal proposal.
    validations:
      required: true

  - type: textarea
    id: interaction_reference
    attributes:
      label: Interaction reference
      description: |
        For user-facing behavior, describe the matching Logic/DAW convention or
        the deliberate deviation. A material lasting deviation requires an ADR.
        Use N/A with a reason when no interaction changes.
    validations:
      required: true

  - type: textarea
    id: governance
    attributes:
      label: Architecture and ADR impact
      description: |
        Identify affected owners and boundaries. Link a proposed/accepted ADR if
        a trigger applies, or state why the change stays within current rules.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - Desktop UI / renderer
        - Audio engine / real-time path
        - Project persistence / database
        - Plug-in hosting
        - Packaging / CI / tooling
        - Docs / contributor experience
        - Other / cross-cutting
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Constraints and risks
      description: |
        Note real-time safety, process boundaries (`window.heron` / native addon),
        compatibility before 1.0, or review cost if relevant.
    validations:
      required: false
