name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate tag and version
        id: release
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::VERSION is not a valid release version: $version"
            exit 1
          fi

          if [[ "$TAG_NAME" != "v$version" ]]; then
            echo "::error::Tag $TAG_NAME does not match VERSION ($version)"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: validate
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      # Ship installers with Cargo.toml thin-LTO release settings.
      full_release_profile: true
    permissions:
      contents: read

  release:
    name: Create draft GitHub release
    needs: [validate, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: yadaw-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS

      - name: Attest release artifacts
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*

      - name: Create or update draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.validate.outputs.tag }}
        run: |
          release_args=(
            --verify-tag
            --generate-notes
            --title "YADAW $TAG_NAME"
            --draft
          )

          if [[ "$TAG_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          if existing_is_draft="$(
            gh release view "$TAG_NAME" --json isDraft --jq .isDraft 2>/dev/null
          )"; then
            if [[ "$existing_is_draft" != "true" ]]; then
              echo "::error::Release $TAG_NAME is already published; refusing to overwrite it."
              exit 1
            fi

            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            gh release create \
              "$TAG_NAME" \
              release-assets/* \
              "${release_args[@]}"
          fi
