name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install locked toolchain
        uses: jdx/mise-action@v4
        with:
          version: 2026.7.13
          cache: true

      - name: Install workspace dependencies
        run: mise run install

      - name: Build documentation
        run: mise run docs-build

      - name: Upload GitHub Pages artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  gate:
    name: Gate
    if: ${{ always() }}
    needs: [test, build, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful CI jobs
        shell: bash
        env:
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          if [[ "$TEST_RESULT" != "success" || "$BUILD_RESULT" != "success" || "$DOCS_RESULT" != "success" ]]; then
            echo "::error::Required CI jobs did not succeed (Test: $TEST_RESULT, Build: $BUILD_RESULT, Docs: $DOCS_RESULT)."
            exit 1
          fi

  deploy-docs:
    name: Deploy documentation
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [gate, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
