name: Test

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  checks:
    name: Checks (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
          - name: Windows x64
            os: windows-latest
          - name: macOS
            os: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          github-token: >-
            ${{ github.event_name == 'pull_request' && '' || github.token }}

      - name: Install Playwright Chromium and Linux dependencies
        if: runner.os == 'Linux'
        run: >-
          pnpm --filter @yadaw/design-system exec playwright install
          --with-deps chromium

      - name: Install Playwright Chromium
        if: runner.os != 'Linux'
        run: >-
          pnpm --filter @yadaw/design-system exec playwright install chromium

      - name: Run repository checks
        run: pnpm check
