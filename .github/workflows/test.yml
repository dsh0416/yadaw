name: Test

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # CI-only compilation tuning. Local dev builds keep full debug info and the
  # optimized dev profile from Cargo.toml; CI only needs line tables for
  # useful backtraces, and MSVC PDB generation is a large part of Windows
  # build time. Incremental compilation is disabled so sccache can cache
  # every rustc invocation (sccache skips incremental compiles).
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  checks:
    name: Checks (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Linux runs the full repository checks with coverage: every test
        # suite executes exactly once with coverage enabled, and
        # the combined coverage pass runs Cargo and Vitest once each. Windows and macOS
        # only run the platform-dependent subset (Rust checks, napi-rs
        # builds, unit and project-database tests); Oxfmt, Oxlint, Vue ESLint,
        # design audits, TypeScript-only checks, and Storybook produce identical
        # results on every platform and would otherwise dominate the slower
        # runners.
        include:
          - name: Linux x64
            os: ubuntu-latest
            check-script: check:coverage
          - name: Windows x64
            os: windows-latest
            check-script: check:native
          - name: macOS
            os: macos-latest
            check-script: check:native
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          github-token: >-
            ${{ github.event_name == 'pull_request' && '' || github.token }}
          cache-rust-build: "true"

      - name: Install Playwright Chromium and Linux dependencies
        if: runner.os == 'Linux'
        run: >-
          pnpm --filter @heron/design-system exec playwright install
          --with-deps chromium

      - name: Run repository checks
        run: pnpm ${{ matrix.check-script }}

      # On Linux the checks above already produced both coverage reports:
      # Vitest wrote lcov during the test pass and the combined coverage
      # orchestrator merged Rust profiles from Cargo tests and instrumented
      # napi calls, keeping output in target-coverage/ so it stays out of the
      # shared Cargo target cache.
      - name: Upload JavaScript coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # Keep this comma-separated list free of spaces: codecov-action
          # forwards each segment verbatim as a --file argument.
          files: apps/desktop/coverage/lcov.info,packages/contracts/coverage/lcov.info,packages/project-db/coverage/lcov.info,packages/project-model/coverage/lcov.info,packages/ui/coverage/lcov.info
          flags: javascript
          name: javascript
          fail_ci_if_error: true
          disable_search: true

      - name: Upload Rust coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/rust/lcov.info
          flags: rust
          name: rust
          fail_ci_if_error: true
          disable_search: true
