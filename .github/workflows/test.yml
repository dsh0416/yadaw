name: Test

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  metadata:
    name: Validate version metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate tag and VERSION
        id: version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::VERSION is not a valid release version: $version"
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($version)"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

  quality:
    name: Formatting, lint, types, and full checks
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          github-token: >-
            ${{ github.event_name == 'pull_request' && '' || github.token }}

      - name: Run repository checks
        run: pnpm check

  platform-tests:
    name: Tests (${{ matrix.name }})
    needs: metadata
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: macOS arm64
            os: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          github-token: >-
            ${{ github.event_name == 'pull_request' && '' || github.token }}

      - name: Run Clippy
        run: pnpm lint:rust

      - name: Run Rust tests and allocation invariants
        run: pnpm test:rust

      - name: Build native bindings for unit tests
        run: pnpm --filter @yadaw/dsp-node build:debug

      - name: Run desktop unit tests
        run: pnpm --filter @yadaw/desktop test:unit

      - name: Run project database integration tests
        run: pnpm --filter @yadaw/project-db test:integration
