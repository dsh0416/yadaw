name: Test

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # CI-only compilation tuning. Local dev builds keep full debug info and the
  # optimized dev profile from Cargo.toml; CI only needs line tables for
  # useful backtraces, and MSVC PDB generation is a large part of Windows
  # build time. Incremental compilation is disabled so sccache can cache
  # every rustc invocation (sccache skips incremental compiles).
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  checks:
    name: Checks (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Linux runs the full repository checks. Windows and macOS only run
        # the platform-dependent subset (Rust checks, napi-rs builds, unit
        # and project-database tests); Prettier, ESLint, design audits,
        # TypeScript-only checks, and Storybook produce identical results on
        # every platform and would otherwise dominate the slower runners.
        include:
          - name: Linux x64
            os: ubuntu-latest
            check-script: check
          - name: Windows x64
            os: windows-latest
            check-script: check:native
          - name: macOS
            os: macos-latest
            check-script: check:native
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          github-token: >-
            ${{ github.event_name == 'pull_request' && '' || github.token }}
          cache-rust-build: "true"

      - name: Install Playwright Chromium and Linux dependencies
        if: runner.os == 'Linux'
        run: >-
          pnpm --filter @yadaw/design-system exec playwright install
          --with-deps chromium

      - name: Run repository checks
        run: pnpm ${{ matrix.check-script }}

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          github-token: >-
            ${{ github.event_name == 'pull_request' && '' || github.token }}
          # Instrumented coverage builds must not overwrite the shared
          # non-coverage Cargo target cache used by Checks.
          cache-rust-build: "false"

      - name: Build native modules required by unit tests
        env:
          # Keep this job's Cargo target separate from instrumented coverage
          # builds below; sccache is fine for ordinary debug napi builds.
          CARGO_INCREMENTAL: "0"
        run: >-
          pnpm --filter @yadaw/dsp-node build:debug
          && pnpm --filter @yadaw/audio-host-client build:debug

      - name: Collect JavaScript coverage
        run: pnpm test:coverage:js

      - name: Collect Rust coverage
        env:
          # sccache skips or interferes with instrumented coverage builds.
          RUSTC_WRAPPER: ""
          CARGO_INCREMENTAL: "0"
        run: pnpm test:coverage:rust

      - name: Upload JavaScript coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: >-
            apps/desktop/coverage/lcov.info,
            packages/project-db/coverage/lcov.info,
            packages/ui/coverage/lcov.info
          flags: javascript
          name: javascript
          fail_ci_if_error: true
          disable_search: true

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/rust/lcov.info
          flags: rust
          name: rust
          fail_ci_if_error: true
          disable_search: true
