name: Build

on:
  workflow_dispatch:
    inputs:
      full_release_profile:
        description: >-
          Keep Cargo.toml thin-LTO release settings (real release artifacts).
          Leave off for faster packaging smoke builds.
        type: boolean
        default: false
      sign_macos:
        description: Sign and notarize the macOS artifact for distribution.
        type: boolean
        default: false
  workflow_call:
    inputs:
      full_release_profile:
        description: >-
          Keep Cargo.toml thin-LTO release settings (real release artifacts).
          Leave off for faster packaging smoke builds.
        type: boolean
        required: false
        default: false
      sign_macos:
        description: Sign and notarize the macOS artifact for distribution.
        type: boolean
        required: false
        default: false
    secrets:
      MAC_CSC_LINK:
        description: Base64-encoded Developer ID Application PKCS#12 archive.
        required: false
      MAC_CSC_KEY_PASSWORD:
        description: Password for the Developer ID Application PKCS#12 archive.
        required: false
      APPLE_API_KEY_P8:
        description: Base64-encoded App Store Connect API private key (.p8).
        required: false
      APPLE_API_KEY_ID:
        description: App Store Connect API key ID.
        required: false
      APPLE_API_ISSUER:
        description: App Store Connect API issuer ID.
        required: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Disable incremental so sccache can cache every rustc invocation.
  CARGO_INCREMENTAL: "0"

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            builder-arch: x64
            mise-task: ci:package:windows-x64
            artifact: windows-x64
            package-glob: release/*.exe
          - name: Linux x64
            os: ubuntu-24.04
            builder-arch: x64
            mise-task: ci:package:linux-x64
            artifact: linux-x64
            package-glob: release/*.AppImage
          - name: Linux arm64
            os: ubuntu-24.04-arm
            builder-arch: arm64
            mise-task: ci:package:linux-arm64
            artifact: linux-arm64
            package-glob: release/*.AppImage
          - name: macOS universal
            os: macos-latest
            builder-arch: universal
            mise-task: ci:package:macos-universal
            artifact: macos-universal
            package-glob: release/*.dmg
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use faster release profile for packaging smoke builds
        if: ${{ !inputs.full_release_profile }}
        shell: bash
        run: |
          {
            echo "CARGO_PROFILE_RELEASE_LTO=false"
            echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16"
            echo "CARGO_PROFILE_RELEASE_DEBUG=0"
            echo "CARGO_PROFILE_RELEASE_STRIP=symbols"
          } >> "$GITHUB_ENV"

      - name: Prepare macOS release credentials
        id: macos_release_credentials
        if: ${{ matrix.builder-arch == 'universal' && inputs.sign_macos }}
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          for variable in \
            MAC_CSC_LINK \
            MAC_CSC_KEY_PASSWORD \
            APPLE_API_KEY_P8 \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER; do
            if [[ -z "${!variable}" ]]; then
              missing+=("$variable")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "::error::sign_macos is missing required secrets: ${missing[*]}"
            exit 1
          fi

          certificate_path="$RUNNER_TEMP/heron-signing-certificate.p12"
          if ! printf '%s' "$MAC_CSC_LINK" | /usr/bin/base64 -D > "$certificate_path"; then
            echo "::error::MAC_CSC_LINK is not valid Base64."
            rm -f "$certificate_path"
            exit 1
          fi
          chmod 600 "$certificate_path"

          certificate_size="$(stat -f '%z' "$certificate_path")"
          certificate_sha256="$(shasum -a 256 "$certificate_path" | awk '{print $1}')"
          echo "macOS signing certificate: size=$certificate_size sha256=$certificate_sha256"

          if ! openssl pkcs12 \
            -info \
            -noout \
            -in "$certificate_path" \
            -passin env:MAC_CSC_KEY_PASSWORD \
            >/dev/null 2>&1; then
            echo "::error::MAC_CSC_LINK does not contain a valid PKCS#12 identity for MAC_CSC_KEY_PASSWORD."
            rm -f "$certificate_path"
            exit 1
          fi

          validation_keychain_path="$RUNNER_TEMP/heron-signing-validation.keychain-db"
          validation_keychain_password="$(openssl rand -hex 32)"
          cleanup_validation_keychain() {
            security delete-keychain "$validation_keychain_path" >/dev/null 2>&1 || true
          }
          trap cleanup_validation_keychain EXIT

          security create-keychain \
            -p "$validation_keychain_password" \
            "$validation_keychain_path"
          security unlock-keychain \
            -p "$validation_keychain_password" \
            "$validation_keychain_path"
          if ! security import \
            "$certificate_path" \
            -k "$validation_keychain_path" \
            -P "$MAC_CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild; then
            echo "::error::MAC_CSC_LINK could not be imported by macOS Security."
            exit 1
          fi

          cleanup_validation_keychain
          trap - EXIT

          api_key_path="$RUNNER_TEMP/heron-notarization-api-key.p8"
          if ! printf '%s' "$APPLE_API_KEY_P8" | /usr/bin/base64 -D > "$api_key_path"; then
            echo "::error::APPLE_API_KEY_P8 is not valid Base64."
            rm -f "$api_key_path"
            exit 1
          fi
          chmod 600 "$api_key_path"

          if ! grep -q '^-----BEGIN PRIVATE KEY-----$' "$api_key_path" || \
            ! grep -q '^-----END PRIVATE KEY-----$' "$api_key_path"; then
            echo "::error::APPLE_API_KEY_P8 does not decode to a PKCS#8 .p8 private key."
            rm -f "$api_key_path"
            exit 1
          fi

          echo "mac_csc_path=$certificate_path" >> "$GITHUB_OUTPUT"
          echo "apple_api_key_path=$api_key_path" >> "$GITHUB_OUTPUT"

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          github-token: >-
            ${{ github.event_name == 'pull_request' && '' || github.token }}

      - name: Build and package application
        env:
          HERON_SIGN_MACOS: ${{ matrix.builder-arch == 'universal' && inputs.sign_macos }}
          CSC_LINK: ${{ steps.macos_release_credentials.outputs.mac_csc_path }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ steps.macos_release_credentials.outputs.apple_api_key_path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: mise run ${{ matrix.mise-task }}

      - name: Remove macOS release credentials
        if: ${{ always() && matrix.builder-arch == 'universal' && inputs.sign_macos }}
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/heron-signing-certificate.p12" \
            "$RUNNER_TEMP/heron-notarization-api-key.p8"

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: heron-${{ matrix.artifact }}
          path: ${{ matrix.package-glob }}
          if-no-files-found: error
          retention-days: 14
