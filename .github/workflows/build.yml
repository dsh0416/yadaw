name: Build

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  package:
    name: Package (${{ matrix.name }})
    needs: metadata
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            builder-arch: x64
            artifact: windows-x64
            package-glob: release/*.exe
          - name: Linux x64
            os: ubuntu-24.04
            builder-arch: x64
            artifact: linux-x64
            package-glob: release/*.AppImage
          - name: Linux arm64
            os: ubuntu-24.04-arm
            builder-arch: arm64
            artifact: linux-arm64
            package-glob: release/*.AppImage
          - name: macOS universal
            os: macos-latest
            builder-arch: universal
            artifact: macos-universal
            package-glob: release/*.dmg
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          github-token: >-
            ${{ github.event_name == 'pull_request' && '' || github.token }}

      - name: Build native binaries and bundled plug-ins
        if: matrix.builder-arch != 'universal'
        run: pnpm build:native

      - name: Build universal macOS binaries and bundled plug-ins
        if: matrix.builder-arch == 'universal'
        shell: bash
        env:
          ARM_TARGET: aarch64-apple-darwin
          X64_TARGET: x86_64-apple-darwin
        run: |
          rustup target add "$ARM_TARGET" "$X64_TARGET"

          for package in @yadaw/dsp-node @yadaw/audio-host-client; do
            pnpm --filter "$package" exec napi build \
              --platform \
              --release \
              --target "$ARM_TARGET"
            pnpm --filter "$package" exec napi build \
              --platform \
              --release \
              --target "$X64_TARGET"
            pnpm --filter "$package" exec napi universalize
          done

          rm -f \
            crates/dsp-node/*.darwin-arm64.node \
            crates/dsp-node/*.darwin-x64.node \
            crates/audio-host-client/*.darwin-arm64.node \
            crates/audio-host-client/*.darwin-x64.node

          lipo -verify_arch arm64 x86_64 \
            crates/dsp-node/yadaw-dsp-node.darwin-universal.node
          lipo -verify_arch arm64 x86_64 \
            crates/audio-host-client/yadaw-audio-host-client.darwin-universal.node

          for target in "$ARM_TARGET" "$X64_TARGET"; do
            cargo build \
              -p yadaw-audio-host \
              --release \
              --target "$target"
            cargo build \
              -p yadaw-vst3-host \
              --bin yadaw-vst3-probe \
              --release \
              --target "$target"
            cargo truce build --vst3 --target "$target"
          done

          mkdir -p target/release
          for binary in yadaw-audio-host yadaw-vst3-probe; do
            lipo -create \
              "target/$ARM_TARGET/release/$binary" \
              "target/$X64_TARGET/release/$binary" \
              -output "target/release/$binary"
            lipo -verify_arch arm64 x86_64 "target/release/$binary"
          done

          for arm_bundle in "target/bundles/$ARM_TARGET"/*.vst3; do
            bundle_name="$(basename "$arm_bundle")"
            x64_bundle="target/bundles/$X64_TARGET/$bundle_name"
            universal_bundle="target/bundles/$bundle_name"
            ditto "$arm_bundle" "$universal_bundle"

            while IFS= read -r -d '' arm_binary; do
              relative_path="${arm_binary#${arm_bundle}/}"
              lipo -create \
                "$arm_binary" \
                "$x64_bundle/$relative_path" \
                -output "$universal_bundle/$relative_path"
              lipo -verify_arch arm64 x86_64 \
                "$universal_bundle/$relative_path"
            done < <(find "$arm_bundle/Contents/MacOS" -type f -print0)
          done

      - name: Build Electron bundles
        run: pnpm --filter @yadaw/desktop build

      - name: Create installer
        run: >-
          pnpm --filter @yadaw/desktop exec electron-builder
          --publish never
          --${{ matrix.builder-arch }}

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: yadaw-${{ needs.metadata.outputs.version }}-${{ matrix.artifact }}
          path: ${{ matrix.package-glob }}
          if-no-files-found: error
          retention-days: 14
