name: Build

on:
  workflow_dispatch:
    inputs:
      full_release_profile:
        description: >-
          Keep Cargo.toml thin-LTO release settings (real release artifacts).
          Leave off for faster packaging smoke builds.
        type: boolean
        default: false
      sign_macos:
        description: Sign and notarize the macOS artifact for distribution.
        type: boolean
        default: false
  workflow_call:
    inputs:
      full_release_profile:
        description: >-
          Keep Cargo.toml thin-LTO release settings (real release artifacts).
          Leave off for faster packaging smoke builds.
        type: boolean
        required: false
        default: false
      sign_macos:
        description: Sign and notarize the macOS artifact for distribution.
        type: boolean
        required: false
        default: false
    secrets:
      MAC_CSC_LINK:
        description: Base64-encoded Developer ID Application PKCS#12 archive.
        required: false
      MAC_CSC_KEY_PASSWORD:
        description: Password for the Developer ID Application PKCS#12 archive.
        required: false
      APPLE_API_KEY_P8:
        description: Base64-encoded App Store Connect API private key (.p8).
        required: false
      APPLE_API_KEY_ID:
        description: App Store Connect API key ID.
        required: false
      APPLE_API_ISSUER:
        description: App Store Connect API issuer ID.
        required: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Disable incremental so sccache can cache every rustc invocation.
  CARGO_INCREMENTAL: "0"

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            builder-arch: x64
            artifact: windows-x64
            package-glob: release/*.exe
          - name: Linux x64
            os: ubuntu-24.04
            builder-arch: x64
            artifact: linux-x64
            package-glob: release/*.AppImage
          - name: Linux arm64
            os: ubuntu-24.04-arm
            builder-arch: arm64
            artifact: linux-arm64
            package-glob: release/*.AppImage
          - name: macOS universal
            os: macos-latest
            builder-arch: universal
            artifact: macos-universal
            package-glob: release/*.dmg
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use faster release profile for packaging smoke builds
        if: ${{ !inputs.full_release_profile }}
        shell: bash
        run: |
          {
            echo "CARGO_PROFILE_RELEASE_LTO=false"
            echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16"
            echo "CARGO_PROFILE_RELEASE_DEBUG=0"
            echo "CARGO_PROFILE_RELEASE_STRIP=symbols"
          } >> "$GITHUB_ENV"

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          github-token: >-
            ${{ github.event_name == 'pull_request' && '' || github.token }}

      - name: Build native binaries and bundled plug-ins
        if: matrix.builder-arch != 'universal'
        run: pnpm build:native

      - name: Build universal macOS binaries and bundled plug-ins
        if: matrix.builder-arch == 'universal'
        shell: bash
        env:
          ARM_TARGET: aarch64-apple-darwin
          X64_TARGET: x86_64-apple-darwin
        run: |
          rustup target add "$ARM_TARGET" "$X64_TARGET"
          test "$(plutil -extract LSUIElement raw build/macos-agent-info.plist)" = "true"

          for package in @heron/dsp-node; do
            pnpm --filter "$package" exec napi build \
              --platform \
              --release \
              --target "$ARM_TARGET"
            pnpm --filter "$package" exec napi build \
              --platform \
              --release \
              --target "$X64_TARGET"
            pnpm --filter "$package" exec napi universalize
          done

          rm -f \
            crates/dsp-node/*.darwin-arm64.node \
            crates/dsp-node/*.darwin-x64.node

          lipo crates/dsp-node/heron-dsp-node.darwin-universal.node \
            -verify_arch arm64 x86_64
          for target in "$ARM_TARGET" "$X64_TARGET"; do
            cargo build \
              --release \
              --target "$target" \
              -p heron-vst3-host
            for binary in heron-vst3-probe; do
              otool -l "target/$target/release/$binary" | \
                grep -q "sectname __info_plist"
            done
            cargo truce build --vst3 --target "$target"
          done

          mkdir -p target/release
          for binary in heron-vst3-probe; do
            lipo -create \
              "target/$ARM_TARGET/release/$binary" \
              "target/$X64_TARGET/release/$binary" \
              -output "target/release/$binary"
            lipo "target/release/$binary" -verify_arch arm64 x86_64
          done

          for arm_bundle in "target/bundles/$ARM_TARGET"/*.vst3; do
            bundle_name="$(basename "$arm_bundle")"
            x64_bundle="target/bundles/$X64_TARGET/$bundle_name"
            universal_bundle="target/bundles/$bundle_name"
            ditto "$arm_bundle" "$universal_bundle"

            while IFS= read -r -d '' arm_binary; do
              relative_path="${arm_binary#${arm_bundle}/}"
              lipo -create \
                "$arm_binary" \
                "$x64_bundle/$relative_path" \
                -output "$universal_bundle/$relative_path"
              lipo "$universal_bundle/$relative_path" \
                -verify_arch arm64 x86_64
            done < <(find "$arm_bundle/Contents/MacOS" -type f -print0)
          done

      - name: Build Electron bundles
        run: pnpm --filter @heron/desktop build

      - name: Prepare macOS release credentials
        id: macos_release_credentials
        if: ${{ matrix.builder-arch == 'universal' && inputs.sign_macos }}
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          for variable in \
            MAC_CSC_LINK \
            MAC_CSC_KEY_PASSWORD \
            APPLE_API_KEY_P8 \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER; do
            if [[ -z "${!variable}" ]]; then
              missing+=("$variable")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "::error::sign_macos is missing required secrets: ${missing[*]}"
            exit 1
          fi

          api_key_path="$RUNNER_TEMP/heron-notarization-api-key.p8"
          if ! printf '%s' "$APPLE_API_KEY_P8" | /usr/bin/base64 -D > "$api_key_path"; then
            echo "::error::APPLE_API_KEY_P8 is not valid Base64."
            rm -f "$api_key_path"
            exit 1
          fi
          chmod 600 "$api_key_path"

          if ! grep -q '^-----BEGIN PRIVATE KEY-----$' "$api_key_path" || \
            ! grep -q '^-----END PRIVATE KEY-----$' "$api_key_path"; then
            echo "::error::APPLE_API_KEY_P8 does not decode to a PKCS#8 .p8 private key."
            rm -f "$api_key_path"
            exit 1
          fi

          echo "apple_api_key_path=$api_key_path" >> "$GITHUB_OUTPUT"

      - name: Create unsigned installer
        if: ${{ matrix.builder-arch != 'universal' || !inputs.sign_macos }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: >-
          pnpm --filter @heron/desktop exec electron-builder
          --publish never
          --${{ matrix.builder-arch }}

      - name: Create signed and notarized macOS installer
        if: ${{ matrix.builder-arch == 'universal' && inputs.sign_macos }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ steps.macos_release_credentials.outputs.apple_api_key_path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: >-
          pnpm --filter @heron/desktop exec electron-builder
          --config electron-builder.release.yml --universal

      - name: Verify packaged Electron security
        env:
          HERON_REQUIRE_DEVELOPER_ID_SIGNATURE: >-
            ${{ matrix.builder-arch == 'universal' && inputs.sign_macos && 'true' || 'false' }}
          HERON_REQUIRE_NOTARIZATION: >-
            ${{ matrix.builder-arch == 'universal' && inputs.sign_macos && 'true' || 'false' }}
        run: pnpm --filter @heron/desktop verify:package-security

      - name: Remove App Store Connect API key
        if: ${{ always() && matrix.builder-arch == 'universal' && inputs.sign_macos }}
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ steps.macos_release_credentials.outputs.apple_api_key_path }}
        run: |
          if [[ -n "$APPLE_API_KEY_P8" ]]; then
            rm -f "$APPLE_API_KEY_P8"
          fi

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: heron-${{ matrix.artifact }}
          path: ${{ matrix.package-glob }}
          if-no-files-found: error
          retention-days: 14
