[workspace]
members = [
    "crates/dsp-core",
    "crates/dsp-node",
    "crates/dsp-runtime",
    "crates/dsp-render",
    "crates/ipc-transport",
    "crates/audio-host",
    "crates/audio-host-client",
    "crates/vst3-host-sys",
    "crates/vst3-host",
    "plugins/yadaw-plugin-ui",
    "plugins/yadaw-gain",
    "plugins/yadaw-metronome",
    "plugins/yadaw-sine",
]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-only"

[workspace.dependencies]
bwavfile = "2.0.1"
bindgen = "0.72.1"
cc = "1"
cpal = "0.18"
criterion = { version = "0.8.2", features = ["csv_output", "html_reports"] }
futures-util = "0.3"
iced_core = "0.14.0"
iced_renderer = { version = "0.14.0", features = ["wgpu-bare"] }
iced_tiny_skia = "0.14.0"
iced_widget = "0.14.0"
iced_winit = "0.14.0"
ipc-channel = { version = "0.22.0", features = ["async"] }
napi = { version = "3", features = ["napi8"] }
napi-build = "2"
napi-derive = "3"
raw-window-handle = "0.6.2"
ringbuf = "0.5"
rubato = "4.0.0"
sha2 = "0.10.9"
midly = "=0.5.3"
libloading = "0.8.9"
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53.0", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
truce = { version = "=6.3.0", default-features = false }
truce-gui-types = "=6.3.0"
truce-iced = "=6.3.0"
truce-test = "=6.3.0"
truce-vst3 = "=6.3.0"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland"] }
zerocopy = { version = "0.8.55", features = ["derive"] }
yadaw-dsp-core = { path = "crates/dsp-core" }
yadaw-dsp-runtime = { path = "crates/dsp-runtime" }
yadaw-dsp-render = { path = "crates/dsp-render" }
yadaw-ipc-transport = { path = "crates/ipc-transport" }
yadaw-audio-host-client = { path = "crates/audio-host-client" }
yadaw-vst3-host = { path = "crates/vst3-host" }
yadaw-vst3-host-sys = { path = "crates/vst3-host-sys" }
yadaw-plugin-ui = { path = "plugins/yadaw-plugin-ui" }

[workspace.lints.rust]
unexpected_cfgs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

[profile.dev]
opt-level = 3
debug = 2
lto = false

[profile.release]
codegen-units = 1
lto = "thin"
