[workspace]
members = ["crates/dsp-core", "crates/dsp-node", "crates/dsp-runtime", "crates/audio-host"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-only"

[workspace.dependencies]
bwavfile = "2.0.1"
cpal = "0.18"
criterion = { version = "0.8.2", features = ["csv_output", "html_reports"] }
napi = { version = "3", features = ["napi8"] }
napi-build = "2"
napi-derive = "3"
ringbuf = "0.5"
rubato = "4.0.0"
sha2 = "0.10.9"
midly = "=0.5.3"
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
yadaw-dsp-core = { path = "crates/dsp-core" }
yadaw-dsp-runtime = { path = "crates/dsp-runtime" }

[profile.release]
codegen-units = 1
lto = "thin"
