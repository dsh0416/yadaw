[workspace]
members = [
    "xtask",
    "crates/audio-plugin",
    "crates/clap-host",
    "crates/dsp-core",
    "crates/dsp-node",
    "crates/dsp-runtime",
    "crates/dsp-render",
    "crates/audio-engine",
    "crates/audio-host",
    "crates/vst3-host-sys",
    "crates/vst3-host",
    "crates/iced-ui",
    "plugins/heron-plugin-ui",
    "plugins/heron-gain",
    "plugins/heron-metronome",
    "plugins/heron-sine",
]
resolver = "3"

[workspace.metadata.cargo-shear]
# Referenced by the expansion of `truce::plugin!` when the plug-in crates enable
# their default `vst3` feature, so cargo-shear cannot observe the source usage.
ignored = ["truce-vst3"]

[workspace.package]
version = "0.4.4"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-only"

[workspace.dependencies]
ara2-bridge-core = "=0.3.0"
ara2-bridge-host = { path = "third_party/ara2-bridge-host" }
ara2-bridge-sys = "=0.3.0"
bwavfile = "2.0.1"
ebur128 = { version = "0.1.10", features = ["precision-true-peak"] }
flac-bound = { version = "0.5.0", default-features = false, features = ["libflac-noogg"] }
bindgen = "0.72.1"
cc = "1"
clap = { version = "4.5.61", features = ["derive"] }
cpal = "0.18"
clap-sys = "=0.5.0"
criterion = { version = "0.8.2", features = ["csv_output", "html_reports"] }
iced_core = "0.14.0"
iced_widget = "0.14.2"
libc = "0.2"
# Standalone Rust tests and benchmarks link the N-API crates without a Node
# host on macOS and Linux. Keep symbol lookup dynamic even with older napi 3.x
# releases where `dyn-symbols` was not part of the default feature set.
napi = { version = "3", features = ["napi8", "dyn-symbols", "tokio_rt"] }
napi-build = "2"
napi-derive = "3"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-core-audio = { version = "0.3.2", default-features = false }
objc2-core-audio-types = { version = "0.3.2", default-features = false }
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }
ringbuf = "0.5"
rubato = "4.0.0"
sha2 = "0.11"
symphonia = { version = "0.6.0", default-features = false, features = ["flac", "mp3", "pcm", "wav"] }
midly = "=0.5.3"
midir = "0.11"
mp3lame-encoder = { version = "0.2.4", features = ["std"] }
libloading = "0.9"
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }
truce = { version = "=6.3.0", default-features = false }
truce-iced = "=6.3.0"
truce-test = "=6.3.0"
truce-vst3 = "=6.3.0"
windows = "0.62.2"
heron-dsp-core = { path = "crates/dsp-core" }
heron-audio-plugin = { path = "crates/audio-plugin" }
heron-clap-host = { path = "crates/clap-host" }
heron-dsp-runtime = { path = "crates/dsp-runtime" }
heron-dsp-render = { path = "crates/dsp-render" }
heron-audio-engine = { path = "crates/audio-engine" }
heron-audio-host = { path = "crates/audio-host" }
heron-vst3-host = { path = "crates/vst3-host" }
heron-vst3-host-sys = { path = "crates/vst3-host-sys" }
heron-iced-ui = { path = "crates/iced-ui" }
heron-plugin-ui = { path = "plugins/heron-plugin-ui" }

[patch.crates-io]
# The published testkit depends on the published host crate. Redirect that edge
# to the audited in-tree host implementation so integration tests exercise the
# same code that ships and Cargo never links two ABI-identical host runtimes.
ara2-bridge-host = { path = "third_party/ara2-bridge-host" }

[workspace.lints.rust]
unexpected_cfgs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

[profile.dev.package.heron-audio-engine]
opt-level = 3

[profile.dev.package.heron-dsp-core]
opt-level = 3

[profile.dev.package.heron-dsp-render]
opt-level = 3

[profile.dev.package.heron-dsp-runtime]
opt-level = 3

[profile.dev.package.heron-vst3-host]
opt-level = 3

[profile.dev.package.rubato]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
