[workspace]
members = [
    "crates/dsp-core",
    "crates/dsp-node",
    "crates/dsp-runtime",
    "crates/dsp-render",
    "crates/shared-memory",
    "crates/ipc-transport",
    "crates/audio-engine",
    "crates/audio-host",
    "crates/audio-host-client",
    "crates/vst3-host-sys",
    "crates/vst3-host",
    "plugins/yadaw-plugin-ui",
    "plugins/yadaw-gain",
    "plugins/yadaw-metronome",
    "plugins/yadaw-sine",
]
resolver = "3"

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-only"

[workspace.dependencies]
ara2-bridge-core = "=0.3.0"
ara2-bridge-host = { path = "third_party/ara2-bridge-host" }
ara2-bridge-sys = "=0.3.0"
bwavfile = "2.0.1"
bindgen = "0.72.1"
cc = "1"
cpal = "0.18"
criterion = { version = "0.8.2", features = ["csv_output", "html_reports"] }
futures-util = "0.3"
getrandom = "0.3"
iced_core = "0.14.0"
iced_renderer = { version = "0.14.0", features = ["wgpu-bare"] }
iced_wgpu = "0.14.0"
iced_widget = "0.14.2"
iced_winit = "0.14.0"
ipc-channel = { version = "0.22.0", features = ["async"] }
libc = "0.2"
# Standalone Rust tests and benchmarks link the N-API crates without a Node
# host on macOS and Linux. Keep symbol lookup dynamic even with older napi 3.x
# releases where `dyn-symbols` was not part of the default feature set.
napi = { version = "3", features = ["napi8", "dyn-symbols"] }
napi-build = "2"
napi-derive = "3"
raw-window-handle = "0.6.2"
ringbuf = "0.5"
rubato = "4.0.0"
sha2 = "0.10.9"
midly = "=0.5.3"
midir = "0.11"
pollster = "0.4"
libloading = "0.8.9"
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
truce = { version = "=6.3.0", default-features = false }
truce-gui-types = "=6.3.0"
truce-iced = "=6.3.0"
truce-test = "=6.3.0"
truce-vst3 = "=6.3.0"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland"] }
windows = "0.61.3"
zerocopy = { version = "0.8.55", features = ["derive"] }
yadaw-dsp-core = { path = "crates/dsp-core" }
yadaw-dsp-runtime = { path = "crates/dsp-runtime" }
yadaw-dsp-render = { path = "crates/dsp-render" }
yadaw-shared-memory = { path = "crates/shared-memory" }
yadaw-ipc-transport = { path = "crates/ipc-transport" }
yadaw-audio-engine = { path = "crates/audio-engine" }
yadaw-audio-host-client = { path = "crates/audio-host-client" }
yadaw-vst3-host = { path = "crates/vst3-host" }
yadaw-vst3-host-sys = { path = "crates/vst3-host-sys" }
yadaw-plugin-ui = { path = "plugins/yadaw-plugin-ui" }

[patch.crates-io]
# The published testkit depends on the published host crate. Redirect that edge
# to the audited in-tree host implementation so integration tests exercise the
# same code that ships and Cargo never links two ABI-identical host runtimes.
ara2-bridge-host = { path = "third_party/ara2-bridge-host" }

[workspace.lints.rust]
unexpected_cfgs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

[profile.dev.package.yadaw-audio-engine]
opt-level = 3

[profile.dev.package.yadaw-dsp-core]
opt-level = 3

[profile.dev.package.yadaw-dsp-render]
opt-level = 3

[profile.dev.package.yadaw-dsp-runtime]
opt-level = 3

[profile.dev.package.yadaw-vst3-host]
opt-level = 3

[profile.dev.package.rubato]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
