[package]
name = "heron-dsp-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
default = []
bench-internals = ["heron-audio-host/bench-internals"]

[dependencies]
bwavfile.workspace = true
napi.workspace = true
napi-derive.workspace = true
ringbuf.workspace = true
rmp-serde.workspace = true
rubato.workspace = true
sha2.workspace = true
heron-audio-host.workspace = true
heron-dsp-core.workspace = true
heron-dsp-runtime.workspace = true

[build-dependencies]
napi-build.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "media_streaming"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "recording"
harness = false
required-features = ["bench-internals"]
