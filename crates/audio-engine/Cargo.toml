[package]
name = "heron-audio-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.cargo-shear]
# Referenced by the expansion of `windows::core::implement` in the Windows
# application-capture backend, so cargo-shear cannot observe the source usage.
ignored = ["windows-core"]

[dependencies]
bwavfile.workspace = true
ebur128.workspace = true
flac-bound.workspace = true
midir.workspace = true
mp3lame-encoder.workspace = true
ringbuf.workspace = true
rubato.workspace = true
thiserror.workspace = true
heron-dsp-core.workspace = true
heron-dsp-render.workspace = true
heron-dsp-runtime.workspace = true
heron-audio-plugin.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
cpal = { workspace = true, features = ["asio", "custom", "realtime"] }
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_KernelStreaming",
  "Win32_Media_Multimedia",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_System_WinRT"
] }
windows-core = "0.62.2"

[target.'cfg(not(target_os = "windows"))'.dependencies]
cpal = { workspace = true, features = ["custom"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, default-features = false, features = ["std", "libc", "NSRunningApplication"] }
objc2-core-audio = { workspace = true, default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-core-audio-types", "objc2-foundation"] }
objc2-core-audio-types = { workspace = true, default-features = false, features = ["CoreAudioBaseTypes"] }
objc2-core-foundation = { workspace = true, default-features = false, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFString"] }
objc2-foundation = { workspace = true, default-features = false, features = ["std", "NSArray", "NSString", "NSURL", "NSUUID", "NSValue"] }

[features]
default = []
bench-internals = []
test-support = []

[lints]
workspace = true
