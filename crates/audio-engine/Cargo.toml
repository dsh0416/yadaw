[package]
name = "heron-audio-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bwavfile.workspace = true
midir.workspace = true
ringbuf.workspace = true
rubato.workspace = true
thiserror.workspace = true
heron-dsp-core.workspace = true
heron-dsp-render.workspace = true
heron-dsp-runtime.workspace = true
heron-vst3-host.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
cpal = { workspace = true, features = ["asio", "custom", "realtime"] }
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_KernelStreaming",
  "Win32_Media_Multimedia",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_System_WinRT"
] }
windows-core = "0.61.2"

[target.'cfg(not(target_os = "windows"))'.dependencies]
cpal = { workspace = true, features = ["custom"] }

[features]
default = []
bench-internals = []
test-support = []

[lints]
workspace = true
