codecov:
  notify:
    manual_trigger: true

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%

ignore:
  - "third_party/**"

comment:
  layout: "header, diff, flags, components, files"
  behavior: default
  require_changes: false

flag_management:
  default_rules:
    carryforward: false
  individual_flags:
    - name: javascript
      paths:
        - apps/desktop/
        - packages/contracts/
        - packages/project-db/
        - packages/project-model/
        - packages/ui/
      carryforward: false
    - name: rust-linux
      paths:
        - crates/
        - plugins/
      carryforward: false
    - name: rust-windows
      paths:
        - crates/
        - plugins/
      carryforward: false
    - name: rust-macos
      paths:
        - crates/
        - plugins/
      carryforward: false

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 1%
      - type: patch
        target: auto
        threshold: 1%
  individual_components:
    - component_id: desktop
      name: desktop
      paths:
        - apps/desktop/**
    - component_id: contracts
      name: contracts
      paths:
        - packages/contracts/**
    - component_id: project-db
      name: project-db
      paths:
        - packages/project-db/**
    - component_id: project-model
      name: project-model
      paths:
        - packages/project-model/**
    - component_id: ui
      name: ui
      paths:
        - packages/ui/**
    - component_id: dsp-core
      name: dsp-core
      paths:
        - crates/dsp-core/**
    - component_id: dsp-node
      name: dsp-node
      paths:
        - crates/dsp-node/**
    - component_id: dsp-runtime
      name: dsp-runtime
      paths:
        - crates/dsp-runtime/**
    - component_id: dsp-render
      name: dsp-render
      paths:
        - crates/dsp-render/**
    - component_id: audio-engine
      name: audio-engine
      paths:
        - crates/audio-engine/**
    - component_id: audio-host
      name: audio-host
      paths:
        - crates/audio-host/**
    - component_id: vst3-host
      name: vst3-host
      paths:
        - crates/vst3-host/**
    - component_id: vst3-host-sys
      name: vst3-host-sys
      paths:
        - crates/vst3-host-sys/**
    - component_id: plugins
      name: plugins
      paths:
        - plugins/**
