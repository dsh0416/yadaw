appId: live.minori.heron
productName: Heron
# AppImage rejects `@` from the scoped package name `@heron/desktop`.
executableName: heron
asar: true
asarUnpack:
  - "**/*.node"
  - "**/@electric-sql/pglite/dist/*.wasm"
  - "**/@electric-sql/pglite/dist/*.data"
npmRebuild: false
# Fuses and ASAR integrity harden loading but do not replace platform code signing.
# CI smoke artifacts use ad-hoc signing; tagged releases require Developer ID signing.
electronFuses:
  # Flipping fuses changes executable pages. Unsigned Apple Silicon builds need
  # a fresh ad-hoc signature or macOS terminates them with CODESIGNING/Invalid Page.
  resetAdHocDarwinSignature: true
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

directories:
  output: ../../release

artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

files:
  - out/**/*
  - build/icon.png
  - build/icon-macos.png
  - package.json
  - node_modules/**/*
  - "!node_modules/@heron/dsp-node/src/**/*"
  - "!node_modules/@heron/dsp-node/Cargo.toml"
  - "!node_modules/@heron/dsp-node/build.rs"
  # Build-only native parsers pulled by Unhead/Unplugin must not enter universal packages.
  - "!node_modules/@oxc-parser/**/*"
  - "!node_modules/oxc-parser/**/*"
  - "!node_modules/@unhead/bundler/**/*"

win:
  icon: build/icon.ico
  extraResources:
    - from: ../../THIRD_PARTY_NOTICES.txt
      to: THIRD_PARTY_NOTICES.txt
    - from: ../../target/release/heron-vst3-probe.exe
      to: heron-vst3-probe.exe
    - from: ../../target/release/heron-clap-probe.exe
      to: heron-clap-probe.exe
    - from: ../../target/bundles
      to: plugins
      filter:
        - Heron Gain.vst3/**/*
        - Heron Metronome.vst3/**/*
        - Heron Sine.vst3/**/*
  target:
    - nsis

mac:
  icon: build/icon.icns
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extraResources:
    - from: ../../THIRD_PARTY_NOTICES.txt
      to: THIRD_PARTY_NOTICES.txt
    - from: ../../target/release/heron-vst3-probe
      to: heron-vst3-probe
    - from: ../../target/release/heron-clap-probe
      to: heron-clap-probe
    - from: ../../target/bundles
      to: plugins
      filter:
        - Heron Gain.vst3/**/*
        - Heron Metronome.vst3/**/*
        - Heron Sine.vst3/**/*
  target:
    - dmg

linux:
  icon: build/icons
  executableArgs:
    - --ozone-platform=x11
  extraResources:
    - from: ../../THIRD_PARTY_NOTICES.txt
      to: THIRD_PARTY_NOTICES.txt
    - from: ../../target/release/heron-vst3-probe
      to: heron-vst3-probe
    - from: ../../target/release/heron-clap-probe
      to: heron-clap-probe
    - from: ../../target/bundles
      to: plugins
      filter:
        - Heron Gain.vst3/**/*
        - Heron Metronome.vst3/**/*
        - Heron Sine.vst3/**/*
  target:
    - AppImage
