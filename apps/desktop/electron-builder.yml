appId: dev.yadaw.studio
productName: YADAW
asar: true
asarUnpack:
  - "**/*.node"
  - "**/@electric-sql/pglite/dist/*.wasm"
  - "**/@electric-sql/pglite/dist/*.data"
npmRebuild: false

directories:
  output: ../../release

files:
  - out/**/*
  - package.json
  - node_modules/**/*
  - "!node_modules/@yadaw/dsp-node/src/**/*"
  - "!node_modules/@yadaw/dsp-node/Cargo.toml"
  - "!node_modules/@yadaw/dsp-node/build.rs"

win:
  extraResources:
    - from: ../../target/release/yadaw-audio-host.exe
      to: yadaw-audio-host.exe
    - from: ../../target/release/yadaw-vst3-probe.exe
      to: yadaw-vst3-probe.exe
    - from: ../../target/bundles
      to: plugins
      filter:
        - YADAW Gain.vst3/**/*
        - YADAW Metronome.vst3/**/*
        - YADAW Sine.vst3/**/*
  target:
    - target: nsis
      arch: [x64]

mac:
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extraResources:
    - from: ../../target/release/yadaw-audio-host
      to: yadaw-audio-host
    - from: ../../target/release/yadaw-vst3-probe
      to: yadaw-vst3-probe
    - from: ../../target/bundles
      to: plugins
      filter:
        - YADAW Gain.vst3/**/*
        - YADAW Metronome.vst3/**/*
        - YADAW Sine.vst3/**/*
  target:
    - target: dmg
      arch: [x64, arm64]

linux:
  extraResources:
    - from: ../../target/release/yadaw-audio-host
      to: yadaw-audio-host
    - from: ../../target/release/yadaw-vst3-probe
      to: yadaw-vst3-probe
    - from: ../../target/bundles
      to: plugins
      filter:
        - YADAW Gain.vst3/**/*
        - YADAW Metronome.vst3/**/*
        - YADAW Sine.vst3/**/*
  target:
    - target: AppImage
      arch: [x64, arm64]
