monorepo_root = true

[tools]
"github:microsoft/apm" = "latest"
node = "26"
pnpm = "latest"
rust = { version = "latest", components = "rustfmt,clippy,llvm-tools" }
"cargo:cargo-llvm-cov" = "0.8.7"
cmake = "3.31.12"
"cargo:cargo-truce" = "6.1.3"

[tools."github:llvm/llvm-project"]
version = "llvmorg-22.1"
os = ["windows"]
matching = "clang+llvm"

[settings]
lockfile = true

[tasks.install]
description = "Install monorepo dependencies from the pnpm lockfile"
run = "pnpm install --frozen-lockfile"
sources = [
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "apps/*/package.json",
  "docs/package.json",
  "packages/*/package.json",
  "crates/*/package.json",
]
outputs = ["node_modules/.pnpm/lock.yaml"]

[tasks.dev]
description = "Build the native addon and start Electron with Vite watchers"
depends = ["install"]
run = "pnpm dev"

[tasks.docs]
description = "Start the user documentation site"
depends = ["install"]
run = "pnpm docs:dev"

[tasks.docs-build]
description = "Build the user documentation site"
depends = ["install"]
run = "pnpm docs:build"

[tasks.check]
description = "Run formatting, lint, Rust, napi-rs, TypeScript, and Vue checks"
depends = ["install"]
run = "pnpm check"

[tasks.check-fast]
description = "Run the fast local Rust formatting, lint, and library-test path"
depends = ["install"]
run = "pnpm check:rust:fast"

[tasks.build]
description = "Build the native addon and all Electron bundles"
depends = ["install"]
run = "pnpm build"

[tasks.pack]
description = "Create an unpacked Electron application"
depends = ["install"]
run = "pnpm --filter @heron/desktop run pack"

[tasks.format]
description = "Format TypeScript, JavaScript, Vue, configuration, docs, and Rust"
depends = ["install"]
run = "pnpm format"

[tasks.format-check]
description = "Check Oxfmt and Rust formatting without modifying files"
depends = ["install"]
run = "pnpm format:check"

[tasks.lint]
description = "Run Oxlint, residual Vue ESLint, and Clippy"
depends = ["install"]
run = "pnpm lint"

[tasks.native]
description = "Build the native addon and VST3 probe (ASIO is always included on Windows)"
depends = ["install"]
run = "node scripts/native-build.ts release"
