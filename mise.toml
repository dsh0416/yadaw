monorepo_root = true

[tools]
"github:microsoft/apm" = "latest"
node = "26"
pnpm = "11.9.0"
rust = "1.97"
cmake = "3.31.12"

[tools."github:llvm/llvm-project"]
version = "llvmorg-22.1"
os = ["windows"]
matching = "clang+llvm"

[settings]
lockfile = true

[tasks.install]
description = "Install monorepo dependencies from the pnpm lockfile"
run = "pnpm install --frozen-lockfile"
sources = [
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "apps/*/package.json",
  "packages/*/package.json",
  "crates/*/package.json",
]
outputs = ["node_modules/.pnpm/lock.yaml"]

[tasks.dev]
description = "Build the native addon and start Electron with Vite watchers"
depends = ["install"]
run = "pnpm dev"

[tasks.check]
description = "Run Rust, napi-rs, TypeScript, and Vue checks"
depends = ["install"]
run = "pnpm check"

[tasks.build]
description = "Build the native addon and all Electron bundles"
depends = ["install"]
run = "pnpm build"

[tasks.pack]
description = "Create an unpacked Electron application"
depends = ["install"]
run = "pnpm --filter @yadaw/desktop pack"

[tasks.format]
description = "Format the Rust workspace"
run = "pnpm format"

[tasks.native]
description = "Build the native addon and VST3 probe (ASIO is always included on Windows)"
depends = ["install"]
run = [
  "pnpm --filter @yadaw/dsp-node build",
  "cmake -S . -B target/vst3-bridge-build -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF",
  "cmake --build target/vst3-bridge-build --config Release --target yadaw-vst3-probe",
]
